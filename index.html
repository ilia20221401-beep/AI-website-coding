<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat – BluesMinds</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, sans-serif; }
        body { background: #0b0d15; color: #eceef5; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 16px; }
        .app { max-width: 900px; width: 100%; height: 90vh; background: #141824; border-radius: 20px; display: flex; flex-direction: column; border:1px solid #2e3852; overflow:hidden; }
        .header { padding: 16px 24px; border-bottom: 1px solid #2e3852; display: flex; justify-content: space-between; align-items: center; background: #141824; }
        .header h1 { font-size: 20px; display:flex; align-items:center; gap:10px; }
        .badge { font-size: 12px; background: rgba(124,109,240,0.2); color: #7c6df0; padding:2px 12px; border-radius: 20px; }
        .chat { flex:1; overflow-y:auto; padding: 20px; display:flex; flex-direction: column; gap: 6px; }
        .message { display: flex; gap: 12px; max-width: 80%; animation: fadeIn .3s; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .avatar { width: 36px; height:36px; border-radius: 50%; display:flex; align-items:center; justify-content:center; font-weight:600; flex-shrink:0; }
        .avatar.ai { background: #7c6df0; color:#fff; }
        .avatar.user { background: #2c3450; color:#fff; }
        .bubble { background: #1a1f2e; padding: 12px 18px; border-radius: 12px; border:1px solid #2e3852; line-height:1.6; }
        .message.user .bubble { background: #7c6df0; border-color:#7c6df0; color:#fff; }
        .timestamp { font-size: 11px; color: #6b7894; display:block; margin-top: 6px; text-align:right; }
        .message.user .timestamp { color: rgba(255,255,255,0.6); }
        .typing { display:none; align-items:center; gap:12px; padding:8px 0; }
        .typing.active { display:flex; }
        .dots { display:flex; gap:5px; background:#1a1f2e; padding:12px 20px; border-radius:12px; border:1px solid #2e3852; }
        .dots span { width:8px; height:8px; background:#6b7894; border-radius:50%; animation: bounce 1.3s infinite; }
        .dots span:nth-child(2){ animation-delay:.15s; }
        .dots span:nth-child(3){ animation-delay:.3s; }
        @keyframes bounce { 0%,60%,100%{transform:translateY(0); opacity:.4} 30%{transform:translateY(-8px); opacity:1} }
        @keyframes fadeIn { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)} }

        .welcome { text-align:center; padding:60px 20px; }
        .welcome .icon { font-size:48px; color:#7c6df0; margin-bottom:16px; }
        .welcome h2 { margin-bottom:8px; }
        .welcome p { color:#9aa3b9; }
        .suggestions { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:20px; }
        .suggestions button { background:#1a1f2e; border:1px solid #2e3852; color:#9aa3b9; padding:8px 18px; border-radius:20px; cursor:pointer; transition:.2s; }
        .suggestions button:hover { background:#2c3450; border-color:#7c6df0; color:#fff; }

        .input-area { padding:16px 24px 20px; border-top:1px solid #2e3852; background:#141824; }
        .input-wrapper { display:flex; gap:10px; background:#232a3d; border-radius:12px; border:1px solid #2e3852; padding:4px 4px 4px 18px; align-items:flex-end; }
        .input-wrapper:focus-within { border-color:#7c6df0; box-shadow:0 0 0 3px rgba(124,109,240,0.2); }
        textarea { flex:1; background:transparent; border:none; outline:none; color:#eceef5; font-size:15px; padding:12px 0; resize:none; min-height:24px; max-height:140px; line-height:1.5; font-family:inherit; }
        textarea::placeholder { color:#6b7894; }
        .send-btn { background:#7c6df0; border:none; color:#fff; width:44px; height:44px; border-radius:10px; font-size:18px; cursor:pointer; transition:.2s; display:flex; align-items:center; justify-content:center; }
        .send-btn:hover { background:#5f4edb; transform:scale(1.03); }
        .send-btn:disabled { opacity:0.4; cursor:not-allowed; transform:none; }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1><i class="fas fa-brain" style="color:#7c6df0;"></i> AI Chat <span class="badge">BluesMinds</span></h1>
        <div>
            <button id="clearChat" style="background:transparent;border:none;color:#6b7894;font-size:18px;cursor:pointer;">🗑️</button>
            <button id="themeToggle" style="background:transparent;border:none;color:#6b7894;font-size:18px;cursor:pointer;">🌙</button>
        </div>
    </div>
    <div class="chat" id="chatArea">
        <div class="welcome" id="welcome">
            <div class="icon"><i class="fas fa-robot"></i></div>
            <h2>How can I help?</h2>
            <p>Ask anything – coding, writing, or just chat.</p>
            <div class="suggestions" id="suggestions">
                <button data-prompt="Write a Python function to reverse a string.">🐍 Reverse string</button>
                <button data-prompt="Explain quantum computing simply.">⚛️ Quantum</button>
                <button data-prompt="Give me 5 creative blog post ideas.">✍️ Blog ideas</button>
            </div>
        </div>
        <div id="messages"></div>
        <div class="typing" id="typing"><div class="dots"><span></span><span></span><span></span></div></div>
    </div>
    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="userInput" rows="1" placeholder="Type a message…"></textarea>
            <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>
<script>
    // ---- DOM refs ----
    const chatArea = document.getElementById('chatArea');
    const messagesDiv = document.getElementById('messages');
    const welcome = document.getElementById('welcome');
    const input = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const clearBtn = document.getElementById('clearChat');
    const typing = document.getElementById('typing');
    const suggestBtns = document.querySelectorAll('#suggestions button');

    let isProcessing = false;

    function timestamp() {
        return new Date().toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'});
    }

    function addMessage(text, sender) {
        welcome.style.display = 'none';
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.innerHTML = `
            <div class="avatar ${sender}">${sender === 'ai' ? 'AI' : 'You'}</div>
            <div class="bubble">
                ${text.replace(/\n/g, '<br>')}
                <span class="timestamp">${timestamp()}</span>
            </div>
        `;
        messagesDiv.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function showTyping() {
        typing.classList.add('active');
        chatArea.scrollTop = chatArea.scrollHeight;
    }
    function hideTyping() { typing.classList.remove('active'); }

    async function sendMessage(text) {
        const msg = text.trim();
        if (!msg || isProcessing) return;
        input.value = '';
        input.style.height = 'auto';
        addMessage(msg, 'user');
        isProcessing = true;
        sendBtn.disabled = true;
        showTyping();

        try {
            const res = await fetch('api.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg })
            });
            const data = await res.json();
            hideTyping();
            if (data.error) addMessage('⚠️ ' + data.error, 'ai');
            else addMessage(data.reply || 'No reply.', 'ai');
        } catch (e) {
            hideTyping();
            addMessage('⚠️ Network error: ' + e.message, 'ai');
        } finally {
            isProcessing = false;
            sendBtn.disabled = false;
            input.focus();
        }
    }

    // ---- Events ----
    sendBtn.addEventListener('click', () => sendMessage(input.value));
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage(input.value);
        }
    });
    input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    });
    clearBtn.addEventListener('click', () => {
        messagesDiv.innerHTML = '';
        welcome.style.display = 'flex';
        hideTyping();
        isProcessing = false;
        sendBtn.disabled = false;
    });
    suggestBtns.forEach(btn => {
        btn.addEventListener('click', () => sendMessage(btn.dataset.prompt));
    });
    // simple theme toggle (just for demo)
    let dark = true;
    document.getElementById('themeToggle').addEventListener('click', () => {
        dark = !dark;
        document.body.style.background = dark ? '#0b0d15' : '#f3f4f8';
        document.querySelector('.app').style.background = dark ? '#141824' : '#ffffff';
        document.querySelector('.app').style.borderColor = dark ? '#2e3852' : '#d0d5e0';
        document.querySelector('.header').style.background = dark ? '#141824' : '#ffffff';
        // ... more toggles – but this is enough for demo
    });

    input.focus();
</script>
</body>
</html>
